ying the webhook does nothing"}, {"id": "A2", "part": "Contact-form backend + inbox", "version": "v3 Pro", "milestone": "Milestone 3.0 · Money + forms + numbers", "est": "2 h", "done": "A form sent from the published page lands in the inbox and the owner's email within a minute"}, {"id": "A3", "part": "Analytics", "version": "v3 Pro", "milestone": "Milestone 3.0 · Money + forms + numbers", "est": "1 h", "done": "Reloads by one visitor count once per day"}, {"id": "A4", "part": "AI copy", "version": "v3 Pro", "milestone": "Milestone 3.1 · Smart + social", "est": "2.5 h", "done": "Suggestions respect limits; nothing changes without a click"}, {"id": "A5", "part": "Comments", "version": "v3 Pro", "milestone": "Milestone 3.1 · Smart + social", "est": "2.5 h", "done": "A comment posted in one tab appears in the other"}, {"id": "A6", "part": "Duplicate + v3 close", "version": "v3 Pro", "milestone": "Milestone 3.1 · Smart + social", "est": "1.5 h", "done": "v3 tagged; case study live"}, {"id": "D1", "part": "Domain panel + Vercel", "version": "v4 Your domain, your code", "milestone": "Milestone 4.0 · Custom domains", "est": "2.5 h", "done": "A test domain goes pending → live in the panel without a reload; SSL valid"}, {"id": "D2", "part": "Host routing + canonical", "version": "v4 Your domain, your code", "milestone": "Milestone 4.0 · Custom domains", "est": "1 h", "done": "`kaapicorner.in` and `kaapi-corner.pagecraft…` serve the same page; canonical points at the domain"}, {"id": "D3", "part": "Static export + GitHub push", "version": "v4 Your domain, your code", "milestone": "Milestone 4.1 · Export + import", "est": "3 h", "done": "Download opens from disk and matches the hosted page; two publishes → two commits in the user's repo"}, {"id": "D4", "part": "Import + v4 close", "version": "v4 Your domain, your code", "milestone": "Milestone 4.1 · Export + import", "est": "1.5 h", "done": "Export → import → identical site; round-trip test green; v4 tagged"}], "docs": [{"name": "PRD", "path": "PRD.md", "md": "# PRD — Pagecraft: Website builder with live co-editing\n\n**Status:** v1 · lifecycle steps 1–7 complete (2026-09-17) — see [docs/](docs/) · next: step 8 Project Setup (= milestone 1.0), **after Tripsmith v3 and the projects ahead of it in build order**\n**Name:** Pagecraft · *build it together*\n**URL:** https://pagecraft.virajdomadia.com (landing live at https://pagecraft-viraj.vercel.app until DNS) · published sites at `{slug}.pagecraft.virajdomadia.com` (and `/s/{slug}` until the wildcard DNS exists)\n**Slot:** #3 · Budget ~53 h (v1 18 · v2 14 · v3 13 · v4 8) · Build fifth\n**Live artifacts:** [Tracker](https://claude.ai/artifact/AxW5iwEzxWmtSdLdfnjQfB) (plan rows with status, all docs, mockups, project facts) · [Screens](https://claude.ai/artifact/UKnMgDx9dvkEmFUrxWSLjS) (all 11 v1 screens, direction C) · [Direction variants](https://claude.ai/artifact/EiUg98AJqi2ZH5UnR71CJo) (A–D, C chosen) · Landing: https://pagecraft-viraj.vercel.app\n\n## One-liner\nA Framer-lite for one-page websites: pick a template, edit sections inline with a teammate in the same page at the same time (live cursors, nothing ever lost), hit Publish and the site is live on its own subdomain — or its own domain — fast, SEO-clean, Lighthouse 100s, and yours to take away as plain files.\n\n## Who it's for\n- **Creator:** a small business or freelancer who needs a one-page site tonight — a café, a salon, a designer, a gym.\n- **Collaborator:** the friend, partner or client editing the same page at the same time (v2).\n- **Platform (Pagecraft):** owns templates, plan limits and the publishing pipeline.\n\n## Why this project\n- It is the \"Figma-type realtime\" slot: a CRDT document, a selection model, presence, undo/redo, and a publishing pipeline that emits real websites — the editor-engineering story Next.js employers recognise at once.\n- The two-tab demo (two cursors, one headline, both people typing) needs no explanation, and the output is a website anyone can open on their phone.\n- The unique feature (v4): the site has reach beyond Pagecraft — your own domain from the same Publish button, and an honest export (static files, GitHub history, import back) that most builders refuse to give. Free to run.\n\n## Locked decisions (2026-09-16) — follow these until the project ends\n\n### 1. Identity: a one-page builder, sections not canvas\nPagecraft builds **one-page sites from sections** (nav, hero, features, gallery, testimonials, pricing, FAQ, contact, CTA, footer — ~10 types, 2–3 layout variants each). No free-form canvas: sections are what people actually finish, and they keep published pages fast and responsive by construction. Three sides — creator, collaborator (v2), platform. Audience voice: Indian small businesses; prices in ₹; the demo is set in Bengaluru.\n\n### 2. Seed content: six templates, one demo site, two demo logins\nTemplates are **fictional but plausible Bengaluru businesses** with CC photos from Wikimedia Commons (credits kept):\n\n| Template | Business | Sections it ships with |\n|---|---|---|\n| Café | *Kaapi Corner*, Indiranagar | nav · hero · features (menu highlights) · gallery · testimonials · contact · footer |\n| Salon | *Loop Studio*, Koramangala | nav · hero · features (services) · pricing · gallery · CTA · footer |\n| Freelancer portfolio | *Meera Rao — brand designer* | nav · hero · gallery (work) · testimonials · CTA · footer |\n| Gym | *Ironline*, HSR | nav · hero · features · pricing · FAQ · CTA · footer |\n| Product launch | *Nimbus — a pour-over kettle* | nav · hero · features · gallery · pricing · FAQ · footer |\n| Restaurant | *Bistro Nine*, Jayanagar | nav · hero · gallery · features (menu) · testimonials · contact · footer |\n\nThe demo site is *Kaapi Corner*, already published. Landing page has two demo logins — **creator** (owner of the demo site) and **collaborator** (editor on it) — and, from v2, an \"Open as your teammate\" button that opens a second tab signed in as the collaborator. v3 adds three premium templates (photographer, boutique, clinic). No wedding or event template (Zapigo overlap).\n\n### 3. Versions — base → mid → advanced → reach\nEvery project is cut base → mid → advanced (rule set 2026-09-15); Pagecraft adds a fourth — the one unique, free-to-run feature every project carries (Viraj, 2026-09-17). v1 alone is a complete, sellable page builder.\n\n| Version | Ships | Proves | ~Hours |\n|---|---|---|---|\n| **v1 Solo studio** (base) | Auth · sites dashboard · new site from one of 6 templates · section editor: add / reorder / delete from a section library, inline text editing, image upload (Vercel Blob), theme = colour palette + font pair · undo/redo · autosave · desktop / tablet / phone preview · publish to `/s/{slug}` **and** `{slug}.pagecraft.virajdomadia.com` (middleware; wildcard DNS flipped when the domain moves) · unpublish, custom slug, SEO title / description / OG image · \"Made with Pagecraft\" badge | A real builder that emits fast, SEO-clean sites (Lighthouse 100s on published pages). The document is a Yjs `Y.Doc` from day one, so v2 adds sync, not a rewrite | 18 |\n| **v2 Studio session** (mid) | Live co-editing: Yjs + pycrdt sync server over SSE, live cursors, selection highlights, presence avatars · invite a collaborator by email (Resend) · version history (last 10 snapshots, restore) · publish diff (\"3 sections changed since last publish\") · \"Try it live\" on the landing | CRDT sync on serverless — the two-tab wow | 14 |\n| **v3 Pro** (advanced) | Pro plan via Razorpay subscription (removes the badge, unlocks 3 premium templates) · contact-form backend with a submissions inbox + email notification · AI section copy (pydantic-ai: \"rewrite this hero for a bakery in Indiranagar\") · per-site page-view analytics · section-level comments for collaborators · duplicate site | Features that make it a product, not a demo | 13 |\n| **v4 Your domain, your code** (reach) | **Custom domains:** the café connects `kaapicorner.in` from Settings — guided DNS panel (the one record to add, live \"checking…\"), the domain is attached to the Vercel project through the Domains API, SSL is issued, `www` redirects, and the same middleware maps the host to the site; Publish stays one click. Pro only (this is what makes Pro worth ₹299). **Export:** *Download* = a zip of static HTML/CSS + images built by the same section renderer that serves `/s/{slug}` — byte-for-byte what Pagecraft serves, Lighthouse 100s included; *Push to GitHub* = the same files committed to a repo in the user's GitHub account (OAuth), re-committed on every publish, so the site has a history outside Pagecraft. **Import:** the zip carries `pagecraft.json` (the document export); drop it on the dashboard and the site is recreated, editable — export → import → identical site is the test | The document + renderer is a real core with reach beyond Pagecraft: your own address, your own files, no lock-in. Runs on free APIs only | 8 |\n\n### 4. The engine: Yjs document, Python CRDT sync, SSE fan-out, server-side publish\n- **Document:** one `Y.Doc` per site — a `site` map (theme, SEO meta) and a `sections` `Y.Array` of `Y.Map`s (`type`, `variant`, `props`), every text field a `Y.Text` (character-level merge), images as URLs (Blob for uploads; template photos are static files in `web/`). The section catalog lives in `web/src/sections/` as one registry (React component + zod schema + defaults + thumbnail); **the editor canvas and the published page render the same components.** Undo/redo = Yjs `UndoManager`.\n- **Persist (v1):** the client batches updates (300 ms) → `POST /sites/{id}/updates`; the API appends them to `site_updates(site_id, seq, update bytea)`. `GET /sites/{id}/doc` returns the last snapshot + tail. Every 50 updates (and on publish) the API **compacts with pycrdt** (Python bindings to Yrs) into `sites.snapshot`. Serverless-safe: no in-memory document anywhere.\n- **Fan-out (v2):** after persisting, the API `XADD`s the update to a capped Upstash Redis stream `site:{id}`; `GET /sites/{id}/stream` (SSE, `maxDuration` 300) loops `XREAD BLOCK 1000` — it wakes on arrival, so update latency ≈ one round trip, no polling interval. Cursors and selection (Yjs awareness) travel through the same stream as ephemeral entries (throttled to 10/s per client) and are never written to Postgres. Reconnect with `Last-Event-ID` = last stream id. Budget ≈ 1 Redis command/s per idle tab.\n- **Publish:** the API loads the CRDT with pycrdt and **exports the JSON server-side** into `publications(site_id, version, content jsonb)` — the published page is computed from the CRDT, never trusted from the client — then calls web's revalidate hook.\n- **Serve:** `web/app/s/[slug]` renders `publications.content` with ISR + tag revalidation; `middleware.ts` rewrites `Host: {slug}.pagecraft.virajdomadia.com` → `/s/{slug}`. `next/image` on Blob URLs, no client JS beyond a tiny interaction script → Lighthouse 100s. Free plan renders a \"Made with Pagecraft\" badge; Pro (v3) removes it.\n- **Why not WebSockets / a hosted realtime service:** Vercel functions can't hold WebSockets, a free always-on host cold-starts in the middle of the demo, and Liveblocks would hide the part this project is meant to prove. Same reasoning as Frontrow; same SSE-on-Vercel envelope.\n\n### 5. Stack and setup — lean\nShared stack from [`projects/README.md`](../README.md): `web/` Next.js App Router + Tailwind 4, `api/` FastAPI on Vercel (FastAPI preset), Neon Postgres, Upstash Redis (v2), Vercel Blob, own cookie-session auth (`pc_session`), Resend (v2), Razorpay subscriptions (v3), pydantic-ai (v3), Vercel Domains API + GitHub OAuth/API (v4, both free). New deps: `yjs` + `y-protocols` (awareness) + `@dnd-kit` in web; `pycrdt` + `redis-py` asyncio in api. Setup is the minimum to deploy both apps with plain CI (web typecheck + build, api ruff + pytest). OpenAPI → TS types generated by a script and committed; no CI freshness gate, no Sentry, no uptime monitor. Accounts and keys are created just-in-time in the plan row that first needs them.\n\nTests only where a demo bug would embarrass: two `Y.Text` edits at the same offset converge (pycrdt, two docs); published JSON equals the CRDT export; slug uniqueness; site membership 403; v2 Playwright two-page edit test; v3 subscription webhook replay; v4 export → import round trip and host → site resolution.\n\n## The wow moment (v2)\nOpen the demo site in two tabs — one as the creator, one as the teammate. Type into the headline in one; the letters appear in the other with a coloured cursor next to them. Both of you edit the same sentence at once and nobody's words vanish. Hit **Publish** and open `kaapi-corner.pagecraft.virajdomadia.com` on your phone.\n\n## Out of scope (all versions)\nFree-form canvas positioning · multi-page sites · rich-text formatting inside text fields (plain text + line breaks only) · custom CSS · e-commerce sections · real-money billing · mobile editing (phone = preview only, \"edit on desktop\").\n\n## Success criteria\n- Two clients editing the same `Y.Text` concurrently always converge to the same document with neither edit lost — covered by a test in CI, and (v2) by a two-page Playwright test.\n- The published page is a pure function of the CRDT: `publications.content` equals pycrdt's export of the site document at publish time (tested).\n- Published sites score Lighthouse mobile 100 perf / 100 a11y / 100 SEO on every seeded template; the editor's own pages stay ≥ 90 perf.\n- v2: a text edit or cursor move is visible in the other tab within ~250 ms.\n- v4: export → import reproduces the site exactly (tested); a custom domain resolves with SSL within 10 minutes of the DNS record going live; the exported `index.html` scores the same Lighthouse numbers as the hosted page.\n- A visible frontend signature: the Blueprint draw-in (every new section traces itself as a wireframe before it fills — chosen in step 4), themed browser surfaces, reduced-motion fallbacks.\n\n## Resolved questions\n- *Self-hosted y-websocket vs Liveblocks?* Neither — own Python sync (pycrdt) over SSE on Vercel; see decision 4 (Viraj, 2026-09-16).\n- *Subdomains vs path?* Both from v1: middleware handles the subdomain, `/s/{slug}` works until the wildcard DNS exists on `virajdomadia.com`.\n- *Co-editing in v1?* No — v1 is the complete single-user builder (base of the niche); co-editing is the v2 distinguishing feature, but v1 is built on `Y.Doc` so v2 is additive.\n- *Images?* Vercel Blob (as Tripsmith), not Cloudinary — one less account.\n- *Who is the admin?* There is no admin console; the platform side is templates + plan limits in code and seed. Creators own sites; collaborators are `site_members`.\n- *A v4?* Yes (Viraj, 2026-09-17): every project carries one unique feature that is free to run. Rejected on the way: an AI collaborator that edits the document live (per-request token cost), Telegram command editing + shop menu board, edit-history replay, A/B branching. Chosen: **custom domains + export + import** — like Tripsmith's MCP server and Frontrow's app, it extends the finished core's reach instead of adding a gimmick, and it reverses v0's \"no custom domains, no code export\" deliberately.\n"}, {"name": "03-requirements", "path": "docs/03-requirements.md", "md": "# Pagecraft — Requirements & Scope\n\n**Lifecycle step:** 3 of 17 · **Locked:** 2026-09-16 · **Source:** [PRD.md](../PRD.md) locked decisions. Flows and screen index: [03-user-flows.md](03-user-flows.md).\n\nActors: **Creator** (owns sites), **Collaborator** (editor on someone else's site, v2), **Visitor** (reads a published site; not signed in). Each requirement ends with **Accept:** — the check that closes it. Ids: R = v1, R2 = v2, R3 = v3, R4 = v4.\n\n---\n\n## v1 — Solo studio (base, ≈ 18 h)\n\n### R1. Auth & sites dashboard\n- Email + password, cookie session (`pc_session`), sign up / sign in / sign out; forgot-password arrives with Resend in v2 (v1 shows \"contact us\"). Two demo logins on the landing page (creator, collaborator).\n- `/sites`: the user's sites as cards (screenshot-less: a live mini render of the hero at 320 px), status draft / published, last edited, published URL; **New site** button. Free plan: 3 sites.\n- **Accept:** protected routes redirect to sign-in and back; a user never sees another user's site (404, not 403, on direct URL).\n\n### R2. New site from a template\n- `/sites/new`: six templates (café, salon, freelancer, gym, product launch, restaurant) with a live preview panel; pick → name the site → the API clones the template's `Y.Doc` snapshot into a new site and opens the editor.\n- Slug defaults to a slugified name and must be unique across the platform; reserved words (`www`, `api`, `app`, `admin`) rejected.\n- **Accept:** create → editor in one round trip; slug collision shows an inline suggestion (`kaapi-corner-2`).\n\n### R3. Editor — document & sections\n- `/sites/[id]/edit`: three panes on ≥ 1024 px — **layers** (ordered sections, drag to reorder, duplicate, delete), **canvas** (the real section components rendered at the chosen width), **inspector** (variant, props of the selected section; theme when nothing is selected). Top bar: site name, undo / redo, width toggle (desktop 1280 / tablet 834 / phone 390), **Publish**.\n- Section library (from the layers pane): nav, hero, features, gallery, testimonials, pricing, FAQ, contact, CTA, footer — each with 2–3 variants and a thumbnail; add inserts below the selected section.\n- Click a section on the canvas → selected (outline + label); click text → inline edit bound to the `Y.Text`; Esc deselects; Delete removes the section (with undo).\n- Inspector fields per section come from its zod schema: text, textarea, image, colour override, link, list (features / FAQ items / plans / testimonials with add / remove / reorder).\n- Images: click → upload (drag-drop or file picker, ≤ 5 MB, jpeg / png / webp) → Vercel Blob → URL into the doc; alt text field. Template images are static files under `web/public/templates/` (same host as published sites); user uploads go to Blob.\n- Theme panel: 8 palettes (each = bg, surface, ink, accent, accent-ink) + 6 font pairs (heading / body from Google Fonts) + radius (sharp / soft / round). A change re-renders every section live.\n- Undo / redo via Yjs `UndoManager` (own edits only, once v2 lands), keyboard `⌘Z` / `⌘⇧Z`.\n- Under 1024 px the editor shows the canvas as a preview with \"Edit on a desktop\" — no mobile editing.\n- **Accept:** every section type renders every variant at 390 / 834 / 1280 without overflow; any edit is undoable; reordering ten sections never loses one; an upload over 5 MB is rejected with a message.\n\n### R4. Autosave & document persistence\n- The client encodes Yjs updates and posts them in batches every 300 ms (or on blur / before unload) to `POST /sites/{id}/updates`; the API appends to `site_updates`. Loading the editor fetches `GET /sites/{id}/doc` (snapshot + tail updates) and applies them.\n- Every 50 appended updates the API compacts snapshot + tail with pycrdt into `sites.snapshot` and trims the tail.\n- Status pill in the top bar: *Saved* / *Saving…* / *Offline — changes kept locally* (the queue is retried; the doc lives in the tab until it drains).\n- **Accept:** test — two `Y.Text` inserts at the same offset applied in either order converge (pycrdt); reload after an edit shows the edit; closing the tab mid-batch loses at most 300 ms of typing.\n\n### R5. Publish\n- Publish dialog: slug (editable), SEO title, description, OG image (pick from site images or upload), then **Publish**. The API compacts the doc, exports it to JSON with pycrdt, validates it against the section schema, stores it as `publications(version n)`, marks the site published, and calls web's revalidate hook.\n- The published page is served at `/s/{slug}` and at `{slug}.pagecraft.virajdomadia.com` (middleware rewrite on `Host`). Unpublish → 404 page with \"This site is not published\". Republish creates version n+1.\n- Published pages: server-rendered from `content`, `next/image` for every image, fonts via `next/font`, one small script for nav toggle / FAQ accordion / gallery lightbox, JSON-LD `LocalBusiness` when the template is a business, `robots` allowed, a \"Made with Pagecraft\" badge (free plan).\n- **Accept:** test — `publications.content` equals pycrdt's export of the doc; publish → the URL shows the change within 5 s; Lighthouse mobile 100 / 100 / 100 on all six seeded templates; slug change keeps the old slug 404 (no redirects in v1).\n\n### R6. Site settings\n- `/sites/[id]/settings`: rename, slug, SEO defaults, unpublish, delete site (type the name). Free-plan badge notice with \"Pro coming soon\" (v3 wires it).\n- **Accept:** delete removes the site, its updates and publications; the published URL 404s.\n\n### R7. Seed & content\n- Seed script (idempotent): platform user, demo creator, demo collaborator, six template docs (built by a Python script that constructs the `Y.Doc` with pycrdt from a JSON description, so templates are real CRDT snapshots), the *Kaapi Corner* demo site owned by the creator with the collaborator as editor, published at `kaapi-corner`. Template photos from Wikimedia Commons in `web/public/templates/` with `CREDITS.md`.\n- **Accept:** `seed` runs twice without duplicates; every template opens in the editor and publishes with Lighthouse 100s.\n\n---\n\n## v2 — Studio session (mid, ≈ 14 h)\n\n### R2-1. Live co-editing\n- `GET /sites/{id}/stream` (SSE): on connect, the current stream position; then every update `XADD`ed by any client, as it arrives (`XREAD BLOCK`); reconnect via `Last-Event-ID`. The client applies remote updates to its `Y.Doc`; its own updates are echoed and ignored by origin.\n- Yjs awareness (cursor position, selected section, text caret, user name + colour) is published to the same stream as ephemeral `aw` entries, throttled to 10/s per client, expiring when the client disconnects or after 30 s of silence.\n- Canvas shows collaborator cursors (name tag, colour), their selected section (coloured outline), and their text caret inside inline edits. Top bar shows presence avatars.\n- Undo only undoes the local user's changes (`UndoManager` with `trackedOrigins`).\n- **Accept:** e2e — two pages, type in one, the other shows the text ≤ 250 ms (500 ms tolerance in CI); both type into the same word → identical text in both, no loss; a dropped stream resumes without a reload.\n\n### R2-2. Invite collaborators\n- Settings → Members: invite by email (role editor) → Resend email with a link → accept (sign up / in) → `site_members` row. Owner can remove; editor can edit and publish but not delete the site or manage members.\n- **Accept:** email arrives with a working link; a removed editor's stream closes and the editor page 404s on reload.\n\n### R2-3. Version history\n- Every publish and every 30 min of activity writes a snapshot (`site_snapshots`, keep last 10). History panel: list with author + time, preview a snapshot read-only on the canvas, **Restore** (applies as a new update, so it is undoable and synced).\n- **Accept:** restore reproduces the snapshot exactly; more than 10 snapshots trims the oldest.\n\n### R2-4. Publish diff\n- Publish dialog shows \"N sections changed since v{last}\" with the section names, computed by comparing the current export with the last publication.\n- **Accept:** editing one section's text shows exactly that section as changed.\n\n### R2-5. Try it live (landing)\n- Landing section with two embedded editor canvases of a scratch copy of the demo site side by side, driven by the real stream, reset hourly.\n- **Accept:** the wow works without opening two tabs.\n\n---\n\n## v3 — Pro (advanced, ≈ 13 h)\n\n### R3-1. Pro plan\n- Razorpay subscription (test mode, ₹299/month): removes the badge, unlocks three premium templates (photographer, boutique, clinic), raises the site limit to 20. Webhook `subscription.activated / charged / cancelled` deduped by event id; plan state on `users`.\n- **Accept:** test — webhook replay is a no-op; downgrade re-adds the badge on next publish.\n\n### R3-2. Contact-form backend\n- The contact section posts to `POST /public/sites/{slug}/submissions` (rate-limited, honeypot); submissions inbox at `/sites/[id]/inbox`; email notification to the owner (Resend).\n- **Accept:** a submission from the published page appears in the inbox and the owner's email within a minute.\n\n### R3-3. AI copy\n- Inspector: \"Rewrite with AI\" on any text field → pydantic-ai (Claude) with the site's business context → three suggestions → pick one → applied as a normal edit (synced, undoable).\n- **Accept:** suggestions respect the field's length limit; nothing is applied without a click.\n\n### R3-4. Analytics\n- Published pages beacon a page view (`POST /public/sites/{slug}/views`, deduped per visitor per day); dashboard card: views last 7 / 30 days as a sparkline.\n- **Accept:** views appear within a minute; reloads by the same visitor don't double count.\n\n### R3-5. Comments\n- Collaborators leave comments anchored to a section (thread, resolve); comment pins on the canvas; count in the layers pane.\n- **Accept:** a comment posted in one tab appears in the other (over the same stream).\n\n### R3-6. Duplicate site\n- `Duplicate` on the dashboard clones the doc into a new draft site.\n\n---\n\n## v4 — Your domain, your code (reach, ≈ 8 h)\n\n### R4-1. Custom domains (Pro)\n- Settings → Domain: enter `kaapicorner.in` (apex or `www`). Pagecraft shows the one record to add at the registrar (apex → `A 76.76.21.21`; subdomain → `CNAME cname.vercel-dns.com`), polls DNS every 15 s with a live *checking…* state, attaches the domain to the `pagecraft` Vercel project through the Domains API, waits for SSL, and marks it *live*. `www` ↔ apex redirect configured automatically. One domain per site; a domain can belong to one site.\n- `middleware.ts` resolves any non-Pagecraft host through `GET /public/hosts/{host}` (cached 5 min, invalidated on change) to the site's slug and rewrites to `/s/{slug}` — the same path the subdomain uses. The Pagecraft subdomain keeps working alongside the custom domain (canonical = the custom domain in `<link rel=\"canonical\">`).\n- Removing the domain detaches it from Vercel and the site falls back to the subdomain. Free plan: the panel shows the flow but the Add button says *Pro*.\n- **Accept:** test — host → slug resolution, unknown host → 404, a domain claimed by another site → 409 `domain_taken`; a real domain resolves with SSL within 10 minutes of the record going live (checked once, by hand, on the demo domain).\n\n### R4-2. Export — Download\n- Settings → Export → *Download zip*: the API renders the **published** version with the same section renderer to static files: `index.html` (inlined critical CSS + one `styles.css`), `/images/*` (copied from Blob / `/templates/`), fonts referenced from Google Fonts, the small interaction script inline, `sitemap.xml`, `robots.txt`, and `pagecraft.json` (the document export + theme + seo + `version`). No badge in the export on Pro; badge kept on Free.\n- Rendering happens in **web** (`POST /api/export` — a Node route that runs `SiteRenderer` to a string, the only place React can render), called by the API's export endpoint with the revalidate secret; the API zips and streams it. Images are fetched and embedded, not linked to Blob.\n- **Accept:** the exported `index.html` opened from disk shows the site with no network beyond fonts; Lighthouse on the export equals the hosted page ±1; the zip contains `pagecraft.json` that validates against `SiteContent`.\n\n### R4-3. Export — Push to GitHub\n- Settings → Export → *Connect GitHub* (OAuth, scope `repo`) → pick or create a repo (`<slug>-site`) → *Push now*, and a toggle *Push on every publish*. Each push commits the same files as the zip with the message `Publish v{n} — {seo.title}`; the commit is made through the Git Data API (one tree, one commit — no clone). The repo README links back to the Pagecraft site and explains `pagecraft.json`.\n- Tokens are stored encrypted per user; disconnecting deletes them. A failed push shows the GitHub error and never blocks Publish.\n- **Accept:** publishing twice yields two commits with the right message; disconnecting revokes and later publishes skip the push with a notice.\n\n### R4-4. Import\n- Dashboard → *Import*: drop a `pagecraft.json` or a whole export zip. The API validates against `SiteContent` (same pydantic mirror as publish), rebuilds a `Y.Doc` with pycrdt (`services/templates.py` already turns JSON into a document), uploads embedded images to Blob, and creates a new draft site. Version and theme are preserved; slug is suggested from the export and checked for collisions.\n- **Accept:** test — export → import → export gives byte-identical `pagecraft.json` (minus ids/timestamps); an export from a different site version still imports.\n\n---\n\n## Out of scope (all versions)\nFree-form canvas · multi-page sites · rich-text formatting inside fields · custom CSS · e-commerce sections · real-money billing · mobile editing · redirects from old slugs · team workspaces (membership is per site).\n"}, {"name": "03-user-flows", "path": "docs/03-user-flows.md", "md": "# Pagecraft — User Flows & Screen Index\n\n**Lifecycle step:** 3 of 17 · **Locked:** 2026-09-16 · Pairs with [03-requirements.md](03-requirements.md); every screen below gets a mockup in [04-ui-mockups.md](04-ui-mockups.md).\n\n## Flow 1 — From template to live site (v1, the main path)\n\n```mermaid\nflowchart LR\n  L[S1 Landing] -->|demo login / sign up| A[S2 Sign in / up]\n  A --> D[S3 Sites dashboard]\n  D -->|New site| T[S4 Template picker]\n  T -->|name + template| E[S5 Editor]\n  E -->|add / reorder / edit| E\n  E -->|autosave 300 ms| U[(site_updates)]\n  E -->|Publish| P[S8 Publish dialog]\n  P -->|slug · SEO · OG| X{API: compact · export · validate}\n  X -->|ok| Live[S9 Published site<br/>slug.pagecraft… and /s/slug]\n  X -->|slug taken| P\n  Live -->|Unpublish in S10| N[S11 Not published 404]\n```\n\n## Flow 2 — Document lifecycle (v1 persistence, v2 sync)\n\n```mermaid\nstateDiagram-v2\n  [*] --> Draft: clone template snapshot\n  Draft --> Draft: updates appended (seq++)\n  Draft --> Compacted: every 50 updates · pycrdt merge → snapshot\n  Compacted --> Draft: more updates\n  Draft --> Published: Publish → export JSON → publications v(n)\n  Published --> Draft: any edit (site stays live on v(n))\n  Published --> Unpublished: Unpublish\n  Unpublished --> Published: Publish again → v(n+1)\n  note right of Draft\n    v1: client POSTs update batches; reload replays snapshot + tail\n    v2: same POST also XADDs to site:{id}; SSE fans out to other tabs\n  end note\n```\n\n## Flow 3 — Publish (v1)\n\n```mermaid\nflowchart TD\n  P[POST /sites/id/publish] --> C[Load snapshot + tail · pycrdt apply]\n  C --> S[Write compacted snapshot]\n  S --> J[Export doc → JSON]\n  J --> V{zod-equivalent pydantic validation}\n  V -->|fail| E[422 with the offending section]\n  V -->|ok| W[publications v(n) · sites.published_slug]\n  W --> R[POST web /api/revalidate?tag=site:slug]\n  R --> OK[200 with URL]\n```\n\n## Flow 4 — Live co-editing (v2)\n\n```mermaid\nsequenceDiagram\n  participant A as Tab A (creator)\n  participant API as FastAPI\n  participant PG as Postgres\n  participant R as Redis stream site:7\n  participant B as Tab B (collaborator)\n  B->>API: GET /sites/7/stream (SSE)\n  A->>API: POST /sites/7/updates [u1]\n  API->>PG: append seq 1042\n  API->>R: XADD site:7 {kind:update, seq:1042, data}\n  loop XREAD BLOCK 1000\n    API->>R: XREAD site:7 > last_id\n  end\n  R-->>API: entry 1042\n  API-->>B: event: update  id: 1700000-0  data: base64(u1)\n  Note over B: Y.applyUpdate → headline changes ≤ 250 ms\n  A->>API: POST /sites/7/awareness {cursor, section, caret}\n  API->>R: XADD site:7 {kind:aw, client:A, state}\n  API-->>B: event: aw\n  Note over B: A's cursor and coloured outline move\n```\n\n## Flow 5 — Invite a collaborator (v2)\n\n```mermaid\nflowchart LR\n  O[S10 Settings → Members] -->|invite email| M[POST /sites/id/invites]\n  M --> Em[Resend: 'Viraj invited you to edit Kaapi Corner']\n  Em -->|link| J[S12 Accept invite]\n  J -->|sign in / up| Row[(site_members editor)]\n  Row --> E[S5 Editor with presence]\n```\n\n## Flow 6 — Pro subscription & contact form (v3)\n\n```mermaid\nflowchart LR\n  subgraph v3 pro\n    Up[S13 Upgrade] --> RZ[Razorpay subscription modal]\n    RZ -->|webhook subscription.activated| Pl[users.plan = pro]\n    Pl --> Pub[next publish: no badge · premium templates]\n  end\n  subgraph v3 contact form\n    Vis[Visitor submits form on S9] --> Sub[POST /public/sites/slug/submissions]\n    Sub --> In[S14 Inbox] & Mail[Owner email]\n  end\n```\n\n## Flow 7 — Custom domain (v4)\n\n```mermaid\nflowchart LR\n  S[S10 Settings → Domain] -->|kaapicorner.in| R[Show DNS record to add]\n  R -->|poll every 15 s| C{record resolves?}\n  C -->|no| R\n  C -->|yes| V[Vercel Domains API: add domain]\n  V --> SSL{certificate issued?}\n  SSL -->|pending| V\n  SSL -->|yes| Live[Domain live · canonical set]\n  Vis[Visitor: kaapicorner.in] --> MW[middleware: host → /public/hosts → slug]\n  MW --> Page[/s/kaapi-corner rendered]\n```\n\n## Flow 8 — Export and import (v4)\n\n```mermaid\nflowchart LR\n  P[Publish v(n)] -->|toggle on| G[Push to GitHub: tree + commit]\n  E[S10 Export → Download] --> W[web /api/export renders SiteRenderer to HTML]\n  W --> Z[API zips html · css · images · pagecraft.json]\n  Z --> D[Download]\n  D -->|later| I[S3 Dashboard → Import zip]\n  I --> Val{validate SiteContent}\n  Val -->|ok| Doc[pycrdt builds Y.Doc · images → Blob]\n  Doc --> New[New draft site]\n  Val -->|bad| Err[422 naming the section]\n```\n\n## Screen index\n\n| # | Screen | Route | Who | Version | Notes |\n|---|---|---|---|---|---|\n| S1 | Landing | `/` | visitor | v1 | Exists; gains demo logins + \"Try it live\" (v2) |\n| S2 | Sign in / Sign up | `/sign-in`, `/sign-up` | all | v1 | Demo buttons |\n| S3 | Sites dashboard | `/sites` | creator | v1 | Cards with live mini hero, status, URL |\n| S4 | Template picker | `/sites/new` | creator | v1 | 6 templates, live preview, name + slug |\n| S5 | Editor | `/sites/[id]/edit` | creator / collaborator | v1 · live in v2 | The signature screen: layers · canvas · inspector; width toggle |\n| S6 | Section library | `/sites/[id]/edit` panel | creator | v1 | 10 types × variants with thumbnails |\n| S7 | Inspector + theme panel | `/sites/[id]/edit` panel | creator | v1 | Schema-driven fields; palettes, font pairs, radius |\n| S8 | Publish dialog | `/sites/[id]/edit` modal | creator | v1 · diff in v2 | Slug, SEO, OG; changed-sections list |\n| S9 | Published site | `/s/[slug]` · `{slug}.pagecraft…` | visitor | v1 | Two templates shown, desktop + 390 px; badge |\n| S10 | Site settings | `/sites/[id]/settings` | creator | v1 · members in v2 | Rename, slug, unpublish, delete |\n| S11 | Not published / 404 | `/s/[slug]` state | visitor | v1 | |\n| S12 | Accept invite | `/invite/[token]` | collaborator | v2 | |\n| S13 | Upgrade to Pro | `/upgrade` | creator | v3 | Razorpay subscription |\n| S14 | Inbox | `/sites/[id]/inbox` | creator | v3 | Contact-form submissions |\n| S15 | History panel | `/sites/[id]/edit` panel | creator | v2 | Snapshots, preview, restore |\n| S16 | Settings · Domain | `/sites/[id]/settings` tab | owner | v4 | DNS record, checking, live, remove |\n| S17 | Settings · Export | `/sites/[id]/settings` tab | owner | v4 | Download zip, GitHub connect + push toggle |\n| S18 | Import | `/sites` dialog | creator | v4 | Drop zip / json, slug check, create |\n"}, {"name": "04-technical-design", "path": "docs/04-technical-design.md", "md": "# Pagecraft — Technical Design\n\n**Lifecycle step:** 4 of 17 · **Locked:** 2026-09-16 · UI companion: [04-ui-mockups.md](04-ui-mockups.md). Schema and routes: [06-data-and-api.md](06-data-and-api.md).\n\n## 1. Stack (shared stack, no deviations)\n| Layer | Choice | Notes |\n|---|---|---|\n| web/ | Next.js 15 App Router · TypeScript strict · Tailwind 4 · pnpm | UI only; `/api/*` rewritten to the API so cookies are same-origin. New: `yjs`, `y-protocols` (awareness), `@dnd-kit/sortable`, `zod` |\n| api/ | FastAPI (Python 3.12, uv) · SQLAlchemy 2.0 async + Alembic · pydantic · pytest | Vercel FastAPI preset, region `bom1`, `maxDuration` 300 for the stream route. New: **`pycrdt`** (Yrs bindings — apply / merge / export Yjs updates in Python) |\n| Data | Neon Postgres | Documents (updates + snapshots), publications, users, members |\n| Realtime (v2) | Upstash Redis (TCP `redis-py` asyncio) | One capped stream per open site; `XREAD BLOCK` for fan-out |\n| Files | Vercel Blob | User-uploaded images; template photos are static files in `web/public/templates/` |\n| Email (v2) | Resend + React Email | Invites, forgot-password, (v3) submissions |\n| Payments (v3) | Razorpay Subscriptions + webhooks, test mode | Pro plan |\n| AI (v3) | pydantic-ai → Claude | Section copy |\n| Domains (v4) | Vercel Domains API (`POST /v10/projects/{id}/domains`, `GET …/domains/{domain}/config`) | Free; token scoped to the `pagecraft` project |\n| Export (v4) | web Node route renders `SiteRenderer` to a string; API zips (`zipfile`) and streams; GitHub Git Data API via OAuth | No clone, one tree + one commit per publish |\n| Contract | `api/openapi.json` → `openapi-typescript` → `web/src/lib/api-types.ts` | Script `pnpm gen:api`; committed; **not** CI-gated |\n| CI | GitHub Actions: `web` (typecheck + build), `api` (ruff + pytest with Postgres service; Redis service from v2) | Nothing else |\n\n## 2. The document\n\nOne `Y.Doc` per site. Shape (what `doc.toJSON()` looks like; `Y.Text` fields are strings in the export):\n\n```jsonc\n{\n  \"site\": { \"name\": \"Kaapi Corner\",\n            \"theme\": { \"palette\": \"espresso\", \"fonts\": \"fraunces-inter\", \"radius\": \"soft\" },\n            \"seo\":   { \"title\": \"Kaapi Corner · Indiranagar\", \"description\": \"…\", \"og_image\": \"/templates/cafe/hero.jpg\" } },\n  \"sections\": [\n    { \"id\": \"s_8f2k\", \"type\": \"hero\", \"variant\": \"split\",\n      \"props\": { \"eyebrow\": \"Since 2019\", \"headline\": \"Filter coffee, done properly.\",\n                 \"body\": \"…\", \"image\": { \"url\": \"https://…\", \"alt\": \"…\" },\n                 \"cta\": { \"label\": \"See the menu\", \"href\": \"#menu\" } } },\n    { \"id\": \"s_1q9z\", \"type\": \"features\", \"variant\": \"grid-3\",\n      \"props\": { \"heading\": \"…\", \"items\": [ { \"id\": \"i_1\", \"title\": \"…\", \"body\": \"…\", \"icon\": \"cup\" } ] } }\n  ]\n}\n```\n\n- `site` is a `Y.Map`; `sections` a `Y.Array<Y.Map>`; every string prop that a user types into is a **`Y.Text`** (character-level merge — two people can edit one headline); enums, urls and numbers are plain values in the `Y.Map` (last-writer-wins is right for \"variant = split\"). Lists (`items`, `plans`, `faqs`) are `Y.Array<Y.Map>` so reorders and concurrent adds merge.\n- Section ids are client-generated nanoids; selection, awareness and comments (v3) key on them.\n- **Section registry** (`web/src/sections/<type>/`): `schema.ts` (zod — props and variants), `defaults.ts`, `<Variant>.tsx` per variant, `thumb.svg`, `fields.ts` (inspector field list derived from the schema). `registry.ts` exports the ten types. The **same components** render in the editor canvas (with `editable` wrappers) and on the published page (plain). The API mirrors the schema as pydantic models (`api/app/sections.py`, hand-kept, validated on publish) — the only duplicated contract, and it is ~80 lines.\n- Undo/redo: `Y.UndoManager` over `site` and `sections`, `trackedOrigins = {localOrigin}`, `captureTimeout = 400` so typing groups into words.\n\n## 3. Editor (web)\n- Route `app/(studio)/sites/[id]/edit`; the whole editor is one client component tree over a `useSiteDoc(siteId)` hook that owns the `Y.Doc`, the persistence queue (§4) and, in v2, the stream.\n- **Layers pane:** `useSyncExternalStore` over `sections` (observeDeep); `@dnd-kit/sortable` reorder = `Y.Array` delete + insert inside one `doc.transact`. Add section → registry defaults → new `Y.Map`.\n- **Canvas:** renders `sections` through the registry inside a `<div>` whose width is the toggle (1280 / 834 / 390) with `container-type: inline-size` so sections use container queries, not viewport queries — the same CSS works on the published page. Selected section: outline + label; hover: faint outline. Not an iframe: same React tree, simpler selection and inline editing, and Tailwind classes are shared.\n- **Inline text:** `<Editable text={yText}>` — a `contentEditable` span bound to `Y.Text` through `y-textarea`-style binding (observe → DOM, `beforeinput` → `yText.insert/delete`); plain text and `\\n` only. In v2 the caret position is published in awareness and drawn for others.\n- **Inspector:** fields generated from `fields.ts`; each field writes to the `Y.Map` / `Y.Text`. Theme panel writes `site.theme`; theme is applied as CSS variables on the canvas root, so a palette change re-renders everything with no per-section work.\n- **Width toggle and phone:** below 1024 px the route renders the canvas only, read-only, with \"Edit on a desktop\".\n- **Motion signature and visual direction:** decided in [04-ui-mockups.md](04-ui-mockups.md) from 3–4 variants. On the table: a new section drawing in as a wireframe before it fills; publish stamping and sliding the page out; comet cursors (v2); theme ripple from the swatch.\n\n## 4. Persistence (v1)\n- `doc.on('update', (u, origin) => queue.push(u))` for local origin; the queue flushes every 300 ms, on `blur`, and on `visibilitychange`/`pagehide` via `navigator.sendBeacon` → `POST /sites/{id}/updates` `{ updates: base64[] }`. Updates are merged client-side with `Y.mergeUpdates` before sending so a flush is one blob.\n- API: `INSERT INTO site_updates (site_id, seq, update, author_id)` with `seq = max+1` under the site's row lock (`SELECT … FOR UPDATE` on `sites`) — the lock is held for ~1 ms and serialises seq; returns `{ seq }`.\n- **Compaction:** if `seq − sites.snapshot_seq ≥ 50` → `Doc()` (pycrdt) → `apply_update(snapshot)` → apply each tail update → `sites.snapshot = doc.get_update()`, `snapshot_seq = seq`, delete tail rows ≤ seq. Runs inline in the request (tens of ms for a page-sized doc); publish always compacts first.\n- Load: `GET /sites/{id}/doc` → `{ snapshot: base64, updates: base64[], seq }`; the client applies both. State vector isn't needed: the client always starts from empty.\n- Offline: the queue persists to `localStorage` (`pc:queue:{siteId}`) and drains on the next flush; the status pill reflects it.\n\n## 5. Realtime (v2): SSE on Vercel, `XREAD BLOCK`\n\n```\nPOST /sites/{id}/updates            (unchanged) + XADD site:{id} MAXLEN ~1000 * kind=update seq=… data=<bytes> author=<user>\nPOST /sites/{id}/awareness          body { state } → XADD site:{id} kind=aw client=<clientID> data=<awareness update>   (never stored in Postgres)\nGET  /sites/{id}/stream?from=<id>   text/event-stream, maxDuration 300\n  event: hello   data: { seq, stream_id, server_time }\n  event: update  id: <stream_id>  data: { seq, author, data: base64 }\n  event: aw      data: { client, data: base64 }\n  event: ping    every 20 s\n```\n\nLoop: `entries = XREAD BLOCK 1000 STREAMS site:{id} last_id` → emit each → repeat; after ~280 s close; `EventSource` reconnects with `Last-Event-ID`. If the id is older than the stream's first entry (trimmed), the server sends `event: resync` and the client refetches `/doc` and re-applies (Yjs makes replaying idempotent). Cursor latency = POST round trip + XREAD wake + SSE push ≈ 100–250 ms from `bom1`.\n\nThe client ignores `update` events whose `author` is itself only when `seq` ≤ its last acked seq (its own updates come back but are no-ops for Yjs anyway). Awareness: `y-protocols/awareness` `Awareness` instance; `encodeAwarenessUpdate` on change, throttled to 100 ms; `removeAwarenessStates` on `pagehide`; remote states expire after 30 s.\n\n**Why a stream and not the version-counter poll Frontrow uses:** documents change many times a second while someone types; `XREAD BLOCK` delivers each change as it lands with no interval, and the stream doubles as the awareness channel. Capped at 1000 entries per site (`MAXLEN ~`), so memory is bounded; Postgres remains the durable log.\n\n**Upstash budget (free tier 500k commands/month):** idle open tab = 1 `XREAD` per second (3,600/h); typing = 1 `XADD` per 300 ms flush + awareness ≤ 10/s. A 30-minute two-tab demo ≈ 25k commands. Fine.\n\nWhy not WebSockets / Liveblocks: Vercel functions can't hold WebSockets; a free always-on host cold-starts mid-demo; a hosted CRDT provider hides the part this project proves.\n\n## 6. Publish pipeline (api)\n1. `POST /sites/{id}/publish` `{ slug, seo }` → owner or editor check → compaction (§4) → `doc = Doc(); doc.apply_update(snapshot)`.\n2. `content = doc.to_py()`-style export (pycrdt `Map`/`Array`/`Text` → plain JSON) → `SiteContent` pydantic validation (types, variants, prop shapes, ≤ 30 sections, image urls on the Blob host or under `/templates/`) → 422 naming the section on failure.\n3. One transaction: `INSERT publications (site_id, version = last+1, content, slug, seo, published_by)`, `UPDATE sites SET published_slug = slug, published_at = now()`. Slug uniqueness = `sites.published_slug UNIQUE` (409 `slug_taken`).\n4. `POST {WEB_URL}/api/revalidate` `{ tag: \"site:{slug}\", secret }` → web calls `revalidateTag`. If web is unreachable the publish still succeeds; ISR's 60 s revalidate catches up.\n5. Unpublish: `published_slug = NULL` + revalidate.\n\n## 7. Serving published sites (web)\n- `app/s/[slug]/page.tsx`: `fetch(API/public/sites/{slug}, { next: { tags: ['site:'+slug], revalidate: 60 } })` → `<SiteRenderer content>` → registry components with `editable=false`, theme as CSS variables on `<main>`, `next/font` for the pair (the six font pairs are preloaded via `next/font/google` and picked by name), `next/image` with `remotePatterns` for the Blob host, `generateMetadata` from `seo`, JSON-LD `LocalBusiness` for business templates. One client component (`SiteScript`) for nav toggle, FAQ accordion, gallery lightbox.\n- `middleware.ts`: if `host` ends with `.pagecraft.virajdomadia.com` and the first label is not `www`/`api` → `NextResponse.rewrite('/s/'+label + pathname)`. `/s/{slug}` stays reachable so the demo works before wildcard DNS. Wildcard: `*.pagecraft.virajdomadia.com` added to the Vercel project when `virajdomadia.com` moves to Vercel DNS.\n- Badge: `content.plan !== 'pro'` → fixed \"Made with Pagecraft\" pill (v3 removes it).\n- Lighthouse 100s: no third-party scripts, images sized via `sizes`, fonts self-hosted through `next/font`, `<h1>` from the hero, alt text required in the schema, colour palettes pre-checked for ≥ 4.5:1 ink-on-bg and accent-ink-on-accent.\n\n## 8. Uploads\n`POST /uploads` (multipart, ≤ 5 MB, jpeg/png/webp, owner/editor of `site_id`) → Pillow check + resize to ≤ 2000 px → `vercel_blob.put('sites/{site_id}/{uuid}.{ext}')` → `{ url, width, height }`. The client writes `{url, alt}` into the doc. Deleting a site deletes its Blob prefix.\n\n## 9. Auth & access\nOwn session auth (as Tripsmith / Frontrow): `users(email, password_hash argon2, name, plan)`, `sessions(id, user_id, expires_at)`, cookie `pc_session` HttpOnly SameSite=Lax. Access to a site = `site_members(site_id, user_id, role owner|editor)` — every `/sites/{id}/*` route resolves the member row first (404 if none). `POST /auth/demo` signs in as the seeded creator or collaborator.\n\n## 10. Caching & rendering\nEditor routes: dynamic, `no-store`. Dashboard: dynamic. Published sites: ISR 60 s + tag revalidation on publish. Landing: static. API `GET /public/sites/{slug}`: `Cache-Control: s-maxage=60, stale-while-revalidate=300`.\n\n## 11. Failure modes worth handling\n| Failure | Behaviour |\n|---|---|\n| Update POST fails | Queue keeps the merged update in `localStorage`, retries with backoff, pill shows *Offline*; nothing is lost while the tab lives |\n| Two tabs, same user (v1, no stream) | Each tab's edits persist; the other sees them on reload — v1 is single-session by design, v2 fixes it |\n| Stream trimmed past `Last-Event-ID` (v2) | `resync` → client refetches `/doc`; Yjs replay is idempotent |\n| Redis down (v2) | Updates still persist to Postgres; stream returns 503 and the client falls back to polling `/doc?since=seq` every 3 s |\n| Publish validation fails | 422 names the section; the editor selects it and shows the message |\n| Web revalidate hook unreachable | Publish succeeds; ISR catches up within 60 s |\n| Compaction races with a concurrent append | Compaction runs under the same `sites` row lock as appends; tail rows above `snapshot_seq` are never deleted |\n\n## 12. Testing (only these)\n- `test_text_converges`: two pycrdt docs insert at the same offset of one `Text`; exchange updates in both orders → identical strings, both insertions present.\n- `test_compaction_equivalent`: snapshot + 60 updates → compact → export equals the export of applying all updates to an empty doc.\n- `test_publish_export`: publish → `publications.content` equals a fresh pycrdt export of the site doc; invalid variant → 422 naming the section.\n- `test_slug_unique_and_reserved`: second site with the same slug → 409; `www` → 422.\n- `test_membership`: non-member → 404 on doc, updates, publish; editor → cannot delete or manage members.\n- v2: `test_stream_replays_after_reconnect` (XADD three, connect from id 2 → receives 3); one Playwright test — two pages, type in one, assert text in the other ≤ 500 ms, both type into one word → equal.\n- v3: `test_subscription_webhook_replay`.\n\n## 12b. v4 — domains, export, import\n- **Custom domains:** `sites.custom_domain` (unique) + `domain_status` (`pending_dns` | `pending_ssl` | `live` | `error`). `POST /sites/{id}/domain` validates the hostname, stores it, returns the DNS instruction; `GET /sites/{id}/domain` is polled by the panel and does the work: `dns.resolver` check → Vercel `add domain` (idempotent) → `config` until `misconfigured = false` → `live`. `www` handled by adding both names with a redirect on the apex. `DELETE` detaches. Host resolution for the middleware: `GET /public/hosts/{host}` → `{ slug }` with `s-maxage=300`; `middleware.ts` treats any host that is not `pagecraft.virajdomadia.com`/`*.pagecraft…`/`localhost` as custom and rewrites to `/s/{slug}` (404 page if unknown). `<link rel=\"canonical\">` prefers the custom domain.\n- **Static export:** the renderer must run in Node, so `web/app/api/export/route.ts` (secret-checked, called by the API) renders `<SiteRenderer content>` with `renderToStaticMarkup`, collects the CSS the sections need (one static `styles.css` built at deploy time from the registry — the same Tailwind output the site uses) and returns `{ html, css }`. The API (`services/export.py`) downloads every image referenced in the content into `/images/`, rewrites the URLs, writes `sitemap.xml`, `robots.txt`, `pagecraft.json` (= `publications.content` + `seo` + `version` + `exported_at`), zips in memory and streams `application/zip`. Badge included on Free.\n- **GitHub push:** OAuth app (scope `repo`), token encrypted with `SESSION_SECRET`-derived key in `github_connections`. `services/github.py`: get ref → create blobs (base64 for images) → create tree → create commit → update ref. Runs after a successful publish when `sites.github_push = true`; failures are logged to the publish response, never block it.\n- **Import:** `POST /sites/import` (multipart zip or json) → find `pagecraft.json` → `SiteContent` validation → `services/templates.py.build_doc(content)` (the same function that builds template docs) → images in the zip uploaded to Blob and URLs rewritten → `sites` + `site_members` rows → editor. Slug from the export, suggestion on collision.\n- **Tests (only these):** `test_host_resolution` (custom host → slug, unknown → 404, taken → 409), `test_export_import_roundtrip` (export → import → export equal modulo ids/timestamps), `test_export_contains` (index.html, styles.css, images, pagecraft.json present; no Blob URLs left).\n- **Failure modes:** Vercel API error → `domain_status = error` with the message in the panel; DNS never resolving → stays `pending_dns` with the instruction shown (no timeout); GitHub token revoked → push skipped with a notice and `github_push` turned off.\n\n## 13. Environment\n`api/`: `DATABASE_URL`, `SESSION_SECRET`, `WEB_URL`, `REVALIDATE_SECRET`, `BLOB_READ_WRITE_TOKEN`; v2: `REDIS_URL`, `RESEND_API_KEY`; v3: `RAZORPAY_KEY_ID`, `RAZORPAY_KEY_SECRET`, `RAZORPAY_WEBHOOK_SECRET`, `ANTHROPIC_API_KEY`; v4: `VERCEL_TOKEN`, `VERCEL_PROJECT_ID`, `VERCEL_TEAM_ID`, `GITHUB_CLIENT_ID`, `GITHUB_CLIENT_SECRET`. `web/`: `API_URL`, `REVALIDATE_SECRET`, `NEXT_PUBLIC_SITE_HOST` (= `pagecraft.virajdomadia.com`), v3: `NEXT_PUBLIC_RAZORPAY_KEY_ID`.\n"}, {"name": "04-ui-mockups", "path": "docs/04-ui-mockups.md", "md": "# Pagecraft — UI Mockups\n\n**Lifecycle step:** 4 of 17 (UX companion to the technical design) · **Brief locked:** 2026-09-16 · **Variants:** built 2026-09-16 — `mockups/direction-variants.html`, published at https://claude.ai/artifact/EiUg98AJqi2ZH5UnR71CJo · **Chosen: C · Blueprint** (Viraj, 2026-09-17)\n**Pairs with:** [03-user-flows.md](03-user-flows.md) — one mockup per v1 screen (S1–S11) after the direction is chosen.\n**Files:** `mockups/landing.html` (exists, already ported to `web/`) → `mockups/direction-variants.html` (S5 editor with the café site on the canvas + S9 the published café on a 390 px phone, four directions) → `mockups/screens.html` (every v1 screen in the chosen direction).\n**Published:** [Direction variants](https://claude.ai/artifact/EiUg98AJqi2ZH5UnR71CJo) · [Screens](https://claude.ai/artifact/UKnMgDx9dvkEmFUrxWSLjS) · [Tracker](https://claude.ai/artifact/AxW5iwEzxWmtSdLdfnjQfB) (Plan rows with status, all docs, mockups, project facts).\n\n## Brief\n**Style:** the existing landing sets the brand — Manrope, ink `#1B1B2F`, indigo `#4338CA` for actions, coral `#FF6B6B` and mint `#2EC4B6` as accents, a faint grid `#E7E5F0` on white. Keep it for the *product chrome*. The variants explore the one question that matters for a builder: **how does the editor chrome relate to the canvas** — and, since the canvas shows the *user's* site in the *user's* theme, the chrome has to recede while still feeling crafted.\n\n**The editor is the product.** Three panes at 1280+: layers (left, 240 px), canvas (centre, fluid, the real site at the toggled width), inspector (right, 300 px). The canvas must read as \"a website, being edited\" at a glance: selection outline + label, hover hint, inline caret. Published sites are the *output* — they use the user's palette and font pair, not Pagecraft's, and must look like a real café site a customer would trust (photo hero, menu highlights, hours, map/contact, reviews).\n\n**Real content:** the *Kaapi Corner* café doc (hero, features, gallery, testimonials, contact, footer) with CC photos of filter coffee, a café interior, a barista — Wikimedia Commons, credits in `mockups/img/CREDITS.md`.\n\n## Motion signature — pick one in the variant page\n| Candidate | What happens | Reduced-motion fallback |\n|---|---|---|\n| **A · Blueprint** | Adding a section draws it in as a wireframe (SVG strokes trace the layout boxes, 500 ms) and then the real content fades into the boxes. Reordering slides neighbours with the same line-trace. | Section fades in, 150 ms |\n| **B · Press** | Publish: the canvas lifts, a \"LIVE\" stamp hits (scale 1.4 → 1 with a 2° tilt), and the page slides out of the frame like a print, revealing the success card with the URL. | Cross-fade to the success card |\n| **C · Comet cursors** (v2) | Collaborator cursors leave a short colour trail as they move; their selected section gets a breathing coloured outline; their caret pulses once when they start typing. | Static cursor + outline |\n| **D · Theme ripple** | Picking a palette swatch sends a circular ripple from the swatch across the canvas; sections recolour as the wave passes (`clip-path: circle()` transition, 700 ms). Font pairs cross-fade. | Instant recolour |\n\nRecommendation was A + D; **Viraj chose direction C (2026-09-17)**, whose moment is A · Blueprint draw-in. Signature = **the page is drawn before it is built**: every new section traces itself as a wireframe and fills; D's theme ripple stays as the v1 theme-panel touch; C's comet cursors arrive with v2; B's press is dropped (publish gets a plain success card).\n\n## Variant page (`mockups/direction-variants.html`) — round 1, built\nFour full-size directions of S5 (the editor at 1280 px, scaled to fit, with the *Kaapi Corner* doc loaded, the hero selected, inspector + theme panel open) and S9 on a 390 px phone, behind an A/B/C/D tab strip (keys 1–4). The café site is one container-query template reused by every canvas and phone; only the chrome changes. Each direction demonstrates one motion candidate live:\n\n| Direction | Chrome | Canvas | Idea |\n|---|---|---|---|\n| **A · Studio** | Dark ink chrome (`#1B1B2F`), light text, indigo accents — Figma-like | The site sits on a mid-grey desk with a soft shadow | The tool recedes; the site is the bright object. **Demonstrates C · Comet cursors:** Ananya's cursor trails, her selected section breathes, her caret types into the eyebrow |\n| **B · Paper desk** | Warm off-white chrome, hairline borders, ink buttons | Site on a cream desk with the faint brand grid | Calm, print-like; the editor feels like a layout table. **Demonstrates B · Press:** Publish lifts the page, stamps LIVE, slides it out, success card rises |\n| **C · Blueprint** | White chrome with the brand grid everywhere, indigo dashed guides, monospace labels + section ids | Site drawn on grid paper; selection = indigo dashed, corner marks | Engineering drawing. **Demonstrates A · Blueprint draw-in:** + Add section traces a CTA band as a wireframe, then fills it |\n| **D · Glass** | Translucent panels over a soft indigo→mint wash, blurred | Site floats on the wash with a coloured shadow | Modern-app look; loudest. **Demonstrates D · Theme ripple:** palette swatches send a clip-path wave across the canvas; font pairs cross-fade |\n\nEach variant carries the same tokens for the *published site* (the café's own theme: cream `#F7F1E8`, coffee ink `#2B1B12`, leaf green `#2F5D45`, Fraunces + Inter, radius 14), so only the chrome changes between tabs. Photos: `mockups/img/` (credits in `CREDITS.md`). `prefers-reduced-motion` respected in all four.\n\n## Chosen direction — C · Blueprint (locked 2026-09-17)\n**Idea:** the editor is an engineering drawing of a website. White chrome on the brand grid (12 px minor, 96 px major), indigo dashed guides and corner marks around the sheet, monospace labels that show section ids — the tool says \"precise instrument\", while the canvas shows the user's site in the user's own theme. Published sites carry none of the chrome.\n\n### Tokens (→ `web/src/app/globals.css`)\n| Token | Value | Use |\n|---|---|---|\n| `--paper` / `--desk` | `#FFFFFF` / `#F7F7FC` | panels, cards / the canvas desk and app background |\n| `--grid` / `--grid-major` | `#E7E5F0` / `#DCDAE8` | 12 px and 96 px grid lines (desk, landing hero, empty states) |\n| `--ink` / `--ink-2` / `--muted` | `#1B1B2F` / `#4A4A66` / `#6E6E8C` | text / secondary / labels (≥ 4.5:1 on paper) |\n| `--line` | `#DCDAE8` | hairline borders, field borders |\n| `--guide` / `--guide-soft` | `#4338CA` / `#EEF0FF` | primary action, selection, dashed guides / selected row, hover fills |\n| `--coral` | `#FF6B6B` | destructive, attention (delete, unpublish, errors); collaborator colours in v2 start here |\n| `--mint` | `#2EC4B6` | saved / published state, focus ring |\n| radii | fields 3 px · buttons 3 px · cards 4 px · phone 38 px | deliberately square — it is a drawing |\n| type | **Manrope** 500/600/700/800 for headings, buttons, body · **JetBrains Mono** 400/500 for section ids, field labels, status pill, slugs, URLs | `next/font/google`, `display: swap` |\n| grid chrome | panels 236 / fluid / 300 px at ≥ 1280; ≥ 1024 collapses the inspector to a drawer; < 1024 = preview only | |\n\n### Motion (all with `prefers-reduced-motion` fallbacks)\n| Moment | Spec | Reduced |\n|---|---|---|\n| **Section draw-in (signature)** | new section mounts with an SVG overlay of its layout boxes: `stroke-dashoffset` 1 → 0, 550 ms ease-out, stagger 60 ms per box, tiny mono labels (`h2`, `button`, `img`); content fades in at 550 ms over 450 ms; lines fade 400 ms after | 150 ms fade |\n| Reorder | neighbours slide 220 ms with the same trace on the moved section | instant |\n| Select | dashed outline 2 px + id label snaps in (no animation); hover = 1 px solid at 55 % | — |\n| Theme change | clip-path circle from the swatch, 750 ms cubic-bezier(.2,.7,.2,1); font pair cross-fade 250 ms | instant |\n| Autosave pill | *Saving…* → *Saved* with the mint dot scaling 1.4 → 1, 180 ms | — |\n| Publish | dialog → success card rises 12 px / 300 ms; URL row highlights once | instant |\n| Template picker | preview cross-fades 200 ms; hovering a template card traces its outline | — |\n| v2 cursors | comet trail (8 px dots, 700 ms fade), breathing outline on the peer's section, labelled caret | static |\n\n### Browser surfaces\n`::selection` guide-soft with ink · scrollbar: desk track, line thumb, 8 px · focus ring mint 3 px offset 2 px · `caret-color` guide · `theme-color` white · favicon = brand mark. Published sites: the user's theme decides these (accent selection, accent caret).\n\n## Screens (`mockups/screens.html`) — built 2026-09-17\nEvery v1 screen from the screen index in direction C: S1 landing (demo logins), S2 sign in/up, S3 dashboard, S4 template picker with live preview, S5 editor (desktop with the draw-in live; phone = read-only preview), S6 section library, S7 inspector + theme (1:1), S8 publish dialog + success, S9 published sites (Kaapi Corner café and Nimbus product launch, desktop + phone), S10 settings, S11 not published. Published at https://claude.ai/artifact/UKnMgDx9dvkEmFUrxWSLjS. **Step 4 complete.** v4 screens (S16 Domain, S17 Export, S18 Import) are settings tabs and a dashboard dialog in the same chrome — mocked when v4 starts, not before.\n"}, {"name": "05-architecture", "path": "docs/05-architecture.md", "md": "# Pagecraft — Architecture\n\n**Lifecycle step:** 5 of 17 · **Locked:** 2026-09-16\n\n## 1. System diagram\n\n```mermaid\nflowchart LR\n  subgraph Browser\n    ED[Editor · Y.Doc<br/>layers · canvas · inspector]\n    VS[Visitor on a published site]\n  end\n  subgraph Vercel\n    WEB[web · pagecraft<br/>Next.js: studio (dynamic) · /s/slug (ISR)<br/>middleware: host → /s/slug<br/>rewrites /api/* →]\n    API[api · pagecraft-api<br/>FastAPI bom1 · pycrdt<br/>REST + SSE + webhooks]\n  end\n  PG[(Neon Postgres<br/>users · sites · site_members<br/>site_updates · snapshots · publications)]\n  RD[(Upstash Redis · v2<br/>stream site:{id} MAXLEN 1000)]\n  BL[Vercel Blob<br/>site images]\n  RS[Resend · v2]\n  RP[Razorpay · v3]\n  AI[Claude via pydantic-ai · v3]\n\n  ED -->|updates 300 ms · same-origin /api/*| WEB --> API\n  ED -.->|SSE /sites/id/stream · v2| API\n  VS -->|slug.pagecraft… or /s/slug| WEB\n  WEB -->|GET /public/sites/slug · tag cache| API\n  API -->|revalidate tag on publish| WEB\n  API --> PG\n  API -->|XADD · XREAD BLOCK| RD\n  API -->|put images| BL\n  API -->|invites · notifications| RS\n  RP -->|subscription webhooks| API\n  API -->|rewrite copy| AI\n```\n\n## 2. Boundaries\n| Component | Owns | Never does |\n|---|---|---|\n| **web/** | The editor (Y.Doc in the browser, selection, undo, inline editing, awareness rendering), the section registry, rendering published sites, host → slug routing | Touch the DB, Redis or Blob directly; decide what gets published |\n| **api/** | Auth, membership, the durable update log, compaction and export (pycrdt), publish validation, stream fan-out, uploads, invites, billing | Render HTML; hold WebSockets; keep a document in memory between requests |\n| **Postgres** | Everything durable: updates, snapshots, publications, members | Fan-out timing |\n| **Redis (v2)** | Per-site stream for updates + awareness — *fast, disposable, capped* | Be the source of truth for a document |\n| **Blob** | Image bytes | Anything else |\n| **Section registry** (`web/src/sections`) | The one definition of what a section is: schema, defaults, component, thumbnail | Diverge from `api/app/sections.py` (hand-mirrored; the publish test catches drift) |\n\nContract: `api/openapi.json` (generated by FastAPI) → `web/src/lib/api-types.ts` via `pnpm gen:api`. The web client (`web/src/lib/api.ts`) is a typed `fetch` that forwards cookies and trusts only the `{ error: { code, message } }` envelope.\n\n## 3. api/ layout\n```\napi/app/\n  main.py            app factory, CORS off (same-origin via rewrite), request-id middleware\n  config.py          pydantic-settings\n  db.py  redis.py    engines; redis-py asyncio (v2)\n  sections.py        pydantic mirror of the section schemas (publish validation)\n  models/            SQLAlchemy 2.0: user, session, site, site_member, site_update, site_snapshot (v2), publication, invite (v2),\n                     subscription + webhook_event (v3), submission (v3), page_view (v3), comment (v3)\n  schemas/           pydantic request/response models (= the OpenAPI contract)\n  routers/           auth, sites (doc, updates, publish, settings), stream (v2), uploads, public (published content, submissions, views), invites (v2), billing (v3), ai (v3)\n  services/\n    crdt.py          pycrdt: apply, compact, export → JSON\n    publish.py       validate, version, revalidate hook\n    stream.py        SSE generator over XREAD BLOCK (v2)\n    templates.py     builds template Y.Docs from JSON descriptions (seed)\n    uploads.py       Pillow + Blob\n  seed/              templates/*.json, photos CREDITS.md, seed.py\ntests/               the tests listed in 04 §12 only\n```\n\n## 4. web/ layout\n```\nweb/src/\n  middleware.ts          host → /s/[slug] rewrite\n  app/(site)/            page.tsx (landing) · s/[slug]/page.tsx · s/[slug]/not-published\n  app/(auth)/            sign-in · sign-up · invite/[token] (v2)\n  app/(studio)/          sites/ · sites/new · sites/[id]/edit · sites/[id]/settings · sites/[id]/inbox (v3) · upgrade (v3)\n  app/api/revalidate/    route.ts (secret-checked revalidateTag)\n  sections/              registry.ts · nav/ hero/ features/ gallery/ testimonials/ pricing/ faq/ contact/ cta/ footer/\n  components/editor/     Editor.tsx · Layers.tsx · Canvas.tsx · Inspector.tsx · ThemePanel.tsx · Editable.tsx · PublishDialog.tsx · Presence.tsx (v2) · Cursors.tsx (v2) · History.tsx (v2)\n  components/renderer/   SiteRenderer.tsx · SiteScript.tsx · Badge.tsx\n  components/landing/    (exists)\n  components/ui/\n  lib/doc/               useSiteDoc.ts · persistence.ts (queue, sendBeacon, localStorage) · stream.ts (v2) · awareness.ts (v2) · undo.ts\n  lib/api.ts · api-types.ts (generated) · session.ts · themes.ts (palettes, font pairs)\n```\n\n## 5. Deployment topology\n- Two Vercel projects per repo (as Tripsmith / Frontrow): `pagecraft` (root `web/`) and `pagecraft-api` (root `api/`, FastAPI preset, `bom1`). `web/next.config.ts` rewrites `/api/:path*` → `API_URL`; cookies are first-party; no CORS.\n- Domains on the `pagecraft` project: `pagecraft.virajdomadia.com` and the wildcard `*.pagecraft.virajdomadia.com` (requires `virajdomadia.com` on Vercel DNS — added when the portfolio domain moves; `/s/{slug}` works before that). Middleware rewrites the host.\n- SSE route sets `maxDuration: 300` in `api/vercel.json` (v2); every other route 30 s. Publish and compaction stay well under.\n- Neon: one project, `main` = production, a `dev` branch for local. Upstash (v2): one Redis, region Mumbai. Blob store on the `pagecraft-api` project. Razorpay webhook (v3) → `https://pagecraft.virajdomadia.com/api/webhooks/razorpay`.\n- Previews: Vercel previews per PR for `web/` pointed at the production API (API previews are SSO-gated).\n- CI (GitHub Actions): `web` = pnpm typecheck + build; `api` = ruff + pytest with `postgres:17` (and `redis:7` from v2). That is all.\n\n## 6. Request paths worth drawing\n**Edit:** keystroke → `Y.Text.insert` → local render (0 ms) → queue → 300 ms → `POST /api/sites/7/updates` → rewrite → FastAPI → `sites` row lock → `INSERT site_updates` (→ v2 `XADD`) → `{ seq }`; every 50th → pycrdt compaction.\n**Publish:** `POST /api/sites/7/publish` → compaction → pycrdt export → pydantic validation → `INSERT publications` → `POST web/api/revalidate` → visitor's next request re-renders `/s/kaapi-corner`.\n**Visit:** `kaapi-corner.pagecraft.virajdomadia.com` → middleware rewrite `/s/kaapi-corner` → ISR page (tag `site:kaapi-corner`) → `GET API/public/sites/kaapi-corner` (on miss) → `<SiteRenderer>`.\n**Live (v2):** tab B `EventSource` → FastAPI generator → `XREAD BLOCK 1000` → tab A's `XADD` wakes it → `event: update` → `Y.applyUpdate` in B.\n\n## 7. Security notes (the short list)\nCookie session HttpOnly + SameSite=Lax; argon2 passwords; membership check on every `/sites/{id}/*` route (404, not 403); update bodies capped at 256 KB and 200 updates per request; uploads type-sniffed and size-capped; published content validated server-side (no raw HTML in any field — text only, links `http(s)`/`#`/`mailto:`/`tel:` only); revalidate hook and Razorpay webhook secret-checked, webhook event ids deduped; `/public/*/submissions` and `/views` rate-limited per IP with a honeypot; no PII in logs.\n"}, {"name": "06-data-and-api", "path": "docs/06-data-and-api.md", "md": "# Pagecraft — Database + API Design\n\n**Lifecycle step:** 6 of 17 · **Locked:** 2026-09-16 · Behaviour in [04-technical-design.md](04-technical-design.md). Alembic `0001_v1` creates everything under **A**; v2/v3 tables get their own migrations.\n\n## A. Postgres schema (v1)\n\n```sql\ncreate type user_plan   as enum ('free','pro');\ncreate type member_role as enum ('owner','editor');\ncreate type template_key as enum ('cafe','salon','freelancer','gym','launch','restaurant',   -- v3: 'photographer','boutique','clinic'\n                                  'photographer','boutique','clinic');\n\nusers        (id uuid pk, email citext unique, password_hash text, name text, plan user_plan default 'free',\n              avatar_colour text, created_at)\nsessions     (id text pk, user_id uuid fk, expires_at timestamptz, created_at)   index (user_id)\n\ntemplates    (key template_key pk, name text, business text, premium bool, snapshot bytea, preview_url text, sort int)\n              -- snapshot = a real Y.Doc update built by services/templates.py from seed/templates/*.json\n\nsites        (id uuid pk, name text, template template_key,\n              snapshot bytea,                 -- compacted Y.Doc state (pycrdt get_update())\n              snapshot_seq bigint default 0,  -- updates ≤ this are folded into snapshot\n              seq bigint default 0,           -- last appended update\n              published_slug citext unique null, published_at timestamptz null, published_version int default 0,\n              created_at, updated_at)   index (updated_at desc)\nsite_members (site_id uuid fk, user_id uuid fk, role member_role, created_at, primary key (site_id, user_id))\n              index (user_id)\nsite_updates (site_id uuid fk, seq bigint, update bytea, author_id uuid fk null, created_at,\n              primary key (site_id, seq))     -- tail above sites.snapshot_seq; trimmed on compaction\npublications (id uuid pk, site_id uuid fk, version int, slug citext, content jsonb, seo jsonb,\n              published_by uuid fk, created_at)   unique (site_id, version) · index (slug, version desc)\n```\n\nDocuments are bytes (Yjs binary updates), never JSON, until publish: `snapshot` + `site_updates` tail = the live document; `publications.content` = the JSON export the renderer reads. `sites.seq` is bumped under the row lock so `site_updates.seq` is gap-free per site. `published_slug` lives on `sites` (unique = platform-wide slug guard) and is copied into each publication for history.\n\n**Row lock recipe** (append and compaction share it):\n```sql\nbegin;  select seq, snapshot_seq from sites where id = $1 for update;\n        insert into site_updates (site_id, seq, update, author_id) values ($1, $seq+1, $update, $user);\n        update sites set seq = $seq+1, updated_at = now() where id = $1;\n        -- if seq+1 - snapshot_seq >= 50: compact (pycrdt) and delete from site_updates where site_id=$1 and seq <= new snapshot_seq\ncommit;\n```\n\n**v2 additions:** `site_snapshots (id, site_id fk, seq bigint, snapshot bytea, label text, author_id, created_at)` index (site_id, created_at desc) — keep 10 per site; `invites (token text pk, site_id fk, email citext, role member_role, invited_by, expires_at, accepted_at null)`; `users.last_seen_at`.\n**v3 additions:** `subscriptions (id, user_id fk unique, razorpay_subscription_id text unique, status text, current_end timestamptz, created_at)`; `webhook_events (id text pk, received_at)`; `submissions (id, site_id fk, data jsonb, ip_hash text, created_at)` index (site_id, created_at desc); `page_views (site_id fk, day date, visitor_hash text, primary key (site_id, day, visitor_hash))`; `comments (id, site_id fk, section_id text, author_id, body text, resolved_at null, created_at)` index (site_id, section_id).\n\n**v4 additions:** `sites.custom_domain citext unique null`, `sites.domain_status text`, `sites.github_repo text null`, `sites.github_push bool default false`; `github_connections (user_id fk pk, login text, token_enc bytea, created_at)`.\n\n## B. Redis keys (v2)\n| Key | Type | Cap / TTL | Written by |\n|---|---|---|---|\n| `site:{id}` | stream · entries `kind=update\\|aw`, `seq`, `author`/`client`, `data` | `MAXLEN ~ 1000` | append (after Postgres commit), awareness POST |\n| `rl:aw:{client}` | int | 1 s | awareness rate limit (10/s) |\n| `rl:sub:{ip}` (v3) | int | 60 s | submissions rate limit (5/min) |\n\n## C. REST API (`/api/*` from the browser; FastAPI serves `/docs`)\n\nError envelope everywhere: `{ \"error\": { \"code\": \"slug_taken\", \"message\": \"…\", \"details\": {…} } }`. Auth via cookie; `🔒` = signed in, `👥` = member of the site (owner or editor; 404 otherwise), `👑` = owner, `⚙` = server-to-server.\n\n### Auth\n| Method | Path | Body → Returns |\n|---|---|---|\n| POST | `/auth/sign-up` | `{ email, password, name }` → `Me` |\n| POST | `/auth/sign-in` | `{ email, password }` → `Me` |\n| POST | `/auth/sign-out` | → 204 |\n| GET | `/auth/me` | `Me { id, name, email, plan, avatar_colour }` · 401 |\n| POST | `/auth/demo` | `{ as: 'creator' \\| 'collaborator' }` → `Me` (landing demo buttons) |\n\n### Sites 🔒\n| Method | Path | Body → Returns |\n|---|---|---|\n| GET | `/sites` | `SiteCard[]` (id, name, template, status draft\\|published, published_url, updated_at, role) |\n| GET | `/templates` | `Template[]` (key, name, business, premium, preview_url, locked for free plan) |\n| POST | `/sites` | `{ name, template }` → 201 `SiteCard` · 402 `plan_limit` (free: 3 sites) · 402 `premium_template` |\n| GET 👥 | `/sites/{id}` | `Site` (card + seo + published_slug + members[]) |\n| GET 👥 | `/sites/{id}/doc?since=` | `{ snapshot: base64, updates: base64[], seq }` — `since` returns only updates > seq (polling fallback) |\n| POST 👥 | `/sites/{id}/updates` | `{ updates: base64[] }` (≤ 200, ≤ 256 KB) → `{ seq }` |\n| POST 👥 | `/sites/{id}/publish` | `{ slug, seo: { title, description, og_image } }` → `{ version, url }` · 409 `slug_taken` · 422 `invalid_content { section_id, message }` · 422 `reserved_slug` |\n| POST 👥 | `/sites/{id}/unpublish` | → 204 |\n| PATCH 👑 | `/sites/{id}` | `{ name?, seo? }` → `Site` |\n| DELETE 👑 | `/sites/{id}` | → 204 (updates, publications, Blob prefix) |\n| POST 👥 | `/uploads` | multipart `file`, `site_id` → `{ url, width, height }` · 413 · 415 |\n\n### Public (no auth)\n| Method | Path | Returns |\n|---|---|---|\n| GET | `/public/sites/{slug}` | `PublishedSite { slug, version, content, seo, plan, template }` · 404 `not_published` · `s-maxage=60` |\n| GET | `/home` | landing: template previews + demo-site URL |\n\n### Server-to-server ⚙\n| Method | Path | Notes |\n|---|---|---|\n| POST (web) | `{WEB_URL}/api/revalidate` | `{ tag, secret }` — web route, called by the API on publish/unpublish |\n\n### v2\n| Method | Path | Notes |\n|---|---|---|\n| GET 👥 | `/sites/{id}/stream?from=` | SSE — `hello` / `update` / `aw` / `resync` / `ping`; `Last-Event-ID` honoured |\n| POST 👥 | `/sites/{id}/awareness` | `{ data: base64 }` → 204 (XADD only; rate-limited) |\n| GET/POST 👑 | `/sites/{id}/invites` | POST `{ email }` → sends Resend mail; GET pending |\n| POST 🔒 | `/invites/{token}/accept` | → `SiteCard` (creates the member row) |\n| DELETE 👑 | `/sites/{id}/members/{user_id}` | → 204 |\n| GET 👥 | `/sites/{id}/snapshots` · POST `/sites/{id}/snapshots/{id}/restore` | list · restore (applies a \"replace\" update, synced + undoable) |\n| GET 👥 | `/sites/{id}/publish/diff` | `{ changed: [{ section_id, type, change: added\\|removed\\|edited }] }` vs last publication |\n| POST | `/auth/forgot` · `/auth/reset` | Resend link |\n\n### v4 (sketch; detailed when v4 starts)\n`POST/GET/DELETE /sites/{id}/domain` 👑 (POST `{ domain }` → `{ status, record: { type, name, value } }` · 409 `domain_taken` · 402 `pro_required`) · `GET /public/hosts/{host}` → `{ slug }` (`s-maxage=300`) · `GET /sites/{id}/export.zip` 👥 · `GET /auth/github` + `/auth/github/callback` 🔒 · `DELETE /auth/github` 🔒 · `POST /sites/{id}/github` 👑 `{ repo, push_on_publish }` · `POST /sites/{id}/github/push` 👑 · `POST /sites/import` 🔒 (multipart) → `SiteCard` · 422 `invalid_export`.\n\n### v3 (sketch; detailed when v3 starts)\n`POST /billing/subscribe` → Razorpay subscription params · `POST /webhooks/razorpay` ⚙ · `POST /public/sites/{slug}/submissions` · `GET /sites/{id}/submissions` 👥 · `POST /public/sites/{slug}/views` · `GET /sites/{id}/analytics` 👥 · `POST /sites/{id}/ai/rewrite` 👥 `{ section_id, field, brief }` → `{ suggestions: string[3] }` · `GET/POST /sites/{id}/comments` 👥 · `POST /sites/{id}/duplicate` 🔒.\n\n## D. Payload shapes that matter\n```ts\ntype SiteContent = {\n  site: { name: string; theme: { palette: PaletteKey; fonts: FontPairKey; radius: 'sharp'|'soft'|'round' };\n          seo: { title: string; description: string; og_image?: string } };\n  sections: Section[];                       // ≤ 30\n};\ntype Section = { id: string; type: SectionType; variant: string; props: Record<string, unknown> };  // props typed per section by zod\ntype SectionType = 'nav'|'hero'|'features'|'gallery'|'testimonials'|'pricing'|'faq'|'contact'|'cta'|'footer';\ntype DocResponse = { snapshot: string; updates: string[]; seq: number };     // base64 Yjs binary\ntype StreamUpdate = { seq: number; author: string | null; data: string };   // SSE `update` event\ntype StreamAwareness = { client: number; data: string };                     // SSE `aw` event\ntype PublishedSite = { slug: string; version: number; content: SiteContent; seo: SiteContent['site']['seo']; plan: 'free'|'pro'; template: string };\n```\n"}, {"name": "07-plan", "path": "docs/07-plan.md", "md": "# Pagecraft — Development Plan\n\n**Lifecycle step:** 7 of 17 · **Written:** 2026-09-16 · **Inputs:** [03-requirements.md](03-requirements.md), [04-technical-design.md](04-technical-design.md), [06-data-and-api.md](06-data-and-api.md).\n**Tracker:** row status lives at https://claude.ai/artifact/AxW5iwEzxWmtSdLdfnjQfB (updated per milestone; rebuild the page with `python mockups/tracker-build.py`).\n**Budget:** v1 ≈ 18 h · v2
