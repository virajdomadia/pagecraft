[project]
name = "pagecraft-api"
version = "0.1.0"
description = "Pagecraft API — FastAPI + pycrdt backend (see docs/04-technical-design.md)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pillow>=11",
    "pycrdt>=0.12",
    "pydantic-settings>=2.8",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.40",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = ["ruff", "pyright", "pytest", "pytest-asyncio"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# api/alembic/ is the migrations dir, not the `alembic` package.
known-third-party = ["alembic"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
